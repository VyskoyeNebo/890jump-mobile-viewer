<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151e"><title>890 Jump · 原厂配色</title><link rel="stylesheet" href="./style.css"></head>
<body><main class="app"><header><div class="brand">ORIGIN <span>JUMPWORKS</span></div><button id="theme" aria-label="切换明暗背景">明 / 暗</button></header>
<section class="title"><p>890 JUMP</p><h1>每一面，都值得细看。</h1><div id="ready">材质修复与核对中</div></section>
<div id="stage"><div id="loading" role="status"><div class="spinner"></div><p id="status">正在准备 3D 查看器…</p><div class="track"><i id="progress"></i></div></div></div>
<nav class="views" aria-label="模型视角"><button data-view="home" class="active">复位</button><button data-view="top">俯视</button><button data-view="bottom">船底</button><button data-view="side">侧面</button><button data-view="front">船首</button><button data-view="rear">船尾</button></nav>
<footer><p class="hint">单指旋转 · 双指缩放 / 平移 · 双击复位</p><div class="settings"><button id="rotate" aria-pressed="false">自动旋转</button><label for="light">亮度</label><input id="light" type="range" min="0.55" max="2" value="0.95" step="0.05"></div><p class="credit">非官方模型查看器 · 舰船与原始美术资源版权归 Cloud Imperium Games</p></footer></main><script defer src="./viewer.js"></script></body></html>
